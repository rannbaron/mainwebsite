name: Daily Early Voting Update

on:
  schedule:
    # 5:30 AM EDT = 09:30 UTC (shortly after NCSBE updates at ~09:20 UTC)
    - cron: '30 9 * * *'
    # 6:05 AM EDT = 10:05 UTC (primary morning run, offset from :00 to avoid runner queue delays)
    - cron: '5 10 * * *'
    # 6:35 AM EDT = 10:35 UTC (secondary morning run)
    - cron: '35 10 * * *'
    # 7:05 AM EDT = 11:05 UTC (fallback run)
    - cron: '5 11 * * *'
  workflow_dispatch:
    inputs:
      test_email_only:
        description: 'Send test summary email without modifying or deploying data'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Update
        if: github.event.inputs.test_email_only != 'true'
        run: |
          python3 update_server.py 2>&1 | tee update.log

      - name: Commit and push updated map data
        if: github.event.inputs.test_email_only != 'true'
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html beta/index.html nc_map_base.json .absentee_2026.meta.json nc_early_voting_party_ev_day_*.csv
          if git diff --staged --quiet; then
            echo "No changes detected on NCSBE S3 today."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated update: Early Voting Day $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Daily Change Summary & Rating Shifts Email
        if: "!cancelled() && (github.event.inputs.test_email_only == 'true' || steps.commit_step.outputs.updated == 'true' || (github.event_name == 'workflow_dispatch' && steps.commit_step.conclusion == 'success'))"
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIBERS_REMOTE_URL: ${{ secrets.SUBSCRIBERS_REMOTE_URL }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            python3 send_daily_summary_email.py --subscribers
          else
            echo "Notice: SMTP_PASSWORD secret is not configured in GitHub repository secrets. Skipping email."
          fi

      - name: Setup Pages
        if: github.event.inputs.test_email_only != 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event.inputs.test_email_only != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.event.inputs.test_email_only != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
