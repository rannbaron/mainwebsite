name: Daily Early Voting Update

on:
  schedule:
    # 5:28 AM EDT = 09:28 UTC (shortly after NCSBE updates at ~09:20 UTC)
    - cron: '28 9 * * *'
    # 6:08 AM EDT = 10:08 UTC (primary morning run, offset to avoid runner queue delays)
    - cron: '8 10 * * *'
    # 6:38 AM EDT = 10:38 UTC (secondary morning run)
    - cron: '38 10 * * *'
    # 7:08 AM EDT = 11:08 UTC (first fallback run)
    - cron: '8 11 * * *'
    # 7:38 AM EDT = 11:38 UTC (second fallback run)
    - cron: '38 11 * * *'
    # 8:08 AM EDT = 12:08 UTC (third fallback run)
    - cron: '8 12 * * *'
  workflow_dispatch:
    inputs:
      test_email_only:
        description: 'Send test summary email to admin only (baronrann@gmail.com)'
        required: false
        default: false
        type: boolean
      force_email:
        description: 'Force send email to all subscribers even if already dispatched today'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Update
        if: github.event.inputs.test_email_only != 'true'
        run: |
          python3 update_server.py 2>&1 | tee update.log

      - name: Send Daily Change Summary & Rating Shifts Email
        if: "!cancelled()"
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIBERS_REMOTE_URL: ${{ secrets.SUBSCRIBERS_REMOTE_URL }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            if [ "${{ github.event.inputs.test_email_only }}" = "true" ]; then
              echo "Dispatching test email to administrator only..."
              python3 send_daily_summary_email.py --recipient "baronrann@gmail.com"
            elif [ "${{ github.event.inputs.force_email }}" = "true" ]; then
              echo "Force-dispatching daily update email to all subscribers..."
              python3 send_daily_summary_email.py --subscribers --force
            else
              echo "Checking dispatch log and sending daily update email to all subscribers..."
              python3 send_daily_summary_email.py --subscribers
            fi
          else
            echo "Notice: SMTP_PASSWORD secret is not configured in GitHub repository secrets. Skipping email."
          fi

      - name: Commit and push updated map data
        if: github.event.inputs.test_email_only != 'true'
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html beta/index.html nc_map_base.json .absentee_2026.meta.json nc_early_voting_*.csv latest_daily_email.json latest_daily_email.html .email_dispatch_log.json
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated update: Early Voting Day $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin main
            git checkout -B beta origin/beta
            git merge --no-edit -X theirs main || git merge --no-edit main
            git push origin beta
            git checkout main --
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: github.event.inputs.test_email_only != 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event.inputs.test_email_only != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.event.inputs.test_email_only != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
