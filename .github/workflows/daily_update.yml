name: Daily Early Voting Update

on:
  schedule:
    # 6:00 AM EDT = 10:00 UTC
    - cron: '0 10 * * *'
    # Fallback at 7:00 AM EDT = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      test_email_only:
        description: 'Send test summary email without modifying or deploying data'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Update
        if: "!github.event.inputs.test_email_only"
        run: |
          python3 update_server.py 2>&1 | tee update.log

      - name: Commit and push updated map data
        if: "!github.event.inputs.test_email_only"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html beta/index.html nc_map_base.json .absentee_2026.meta.json nc_early_voting_party_ev_day_*.csv
          if git diff --staged --quiet; then
            echo "No changes detected on NCSBE S3 today."
          else
            git commit -m "Automated update: Early Voting Day $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Send Daily Change Summary & Rating Shifts Email
        if: always()
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            python3 send_daily_summary_email.py --recipient "baronrann@gmail.com"
          else
            echo "Notice: SMTP_PASSWORD secret is not configured in GitHub repository secrets. Skipping email."
          fi

      - name: Setup Pages
        if: "!github.event.inputs.test_email_only"
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: "!github.event.inputs.test_email_only"
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: "!github.event.inputs.test_email_only"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
