name: Switch to Election Day Voting Info

on:
  schedule:
    # Saturday, October 31, 2026 at 3:00 PM EDT = 19:00 UTC (When Early Voting ends across NC)
    - cron: '0 19 31 10 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  switch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install qrcode pillow

      - name: Run Election Day Static Generator
        run: |
          set -o pipefail
          python3 generate_election_day_pages.py 2>&1 | tee switchover.log

      - name: Commit and Push Changes to main
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Switch voting platform to Election Day voting info (Early voting concluded)"
            git push origin main
          fi

      - name: Send Switchover Success Notification Email
        if: success()
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 send_switchover_notification.py \
            --status success \
            --recipient "rann@rannbar-on.com" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Send Switchover Failure Alert Email
        if: failure()
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ ! -s switchover.log ]; then
            echo "Failure occurred prior to or after page generation (check GitHub Actions workflow logs for details)." > switchover.log
          fi
          python3 send_switchover_notification.py \
            --status failure \
            --recipient "rann@rannbar-on.com" \
            --error-log switchover.log \
            --run-id "$GITHUB_RUN_ID"
